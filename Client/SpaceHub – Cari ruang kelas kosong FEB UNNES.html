<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpaceHub – Cari ruang kelas kosong FEB UNNES</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f5fd;--sf:#fff;--ink:#0f1d3d;--mut:#5a6785;--ln:#dbe3f3;--bl:#1d4ed8;--navy:#0b2a6f;--yel:#ffc72c;--yt:#1a1500;--fr:#dfe8fb;--ok:#1d4ed8;--gf:#a7e3bd;--or:#f08a24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--sf:#121c38;--ink:#e7ecf8;--mut:#98a6c4;--ln:#25335a;--bl:#5b8cff;--navy:#07163f;--fr:#1c2a52;--ok:#5b8cff;--gf:#1f6a43;--or:#ff9f45}}
:root[data-theme="dark"]{--bg:#0a1226;--sf:#121c38;--ink:#e7ecf8;--mut:#98a6c4;--ln:#25335a;--bl:#5b8cff;--navy:#07163f;--fr:#1c2a52;--ok:#5b8cff;--gf:#1f6a43;--or:#ff9f45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
h1,h2,h3,p{margin:0}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:20px;padding:0 10px 16px}.logo b{color:var(--yel)}
aside button.nv{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-left:3px solid transparent;color:#c9d6f5;text-align:left;padding:10px 12px;border-radius:6px;font-weight:600}
aside button.nv.on{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--yel)}
.bd{background:var(--yel);color:var(--yt);border-radius:99px;font-size:11px;padding:0 7px;font-weight:800}
.me{margin-top:auto;font-size:12px;color:#c9d6f5;padding:12px 10px;border-top:1px solid rgba(255,255,255,.15)}
.me button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px}
main{padding:24px;max-width:1000px;width:100%}
.hero{background:linear-gradient(90deg,rgba(11,42,111,.96) 45%,rgba(11,42,111,.55)),var(--img) center/cover;color:#fff;border-radius:14px;padding:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.hero h2{font-size:24px;font-weight:800}.hero p{max-width:360px;font-size:13px;opacity:.9}
.st{display:flex;gap:10px}.st div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 14px;text-align:center;font-size:11px}.st b{display:block;font-size:24px;color:var(--yel);line-height:1.1}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut);font-weight:600}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{background:var(--sf);border:1px solid var(--ln);color:var(--ink);border-radius:99px;padding:5px 14px;font-size:12px}
.chip.on{background:var(--yel);border-color:var(--yel);color:var(--yt);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.rc{display:flex;gap:12px;text-align:left;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:10px;position:relative;width:100%}
.rc:hover{border-color:var(--bl)}
.rc img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:none}
.rc h3{font-size:15px}.rc p{font-size:12px;color:var(--mut)}
.tg{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.tg i{font-style:normal;background:var(--fr);color:var(--bl);border-radius:5px;padding:0 6px;font-size:11px;font-weight:600}
.pill{display:inline-block;background:var(--yel);color:var(--yt);border-radius:99px;padding:1px 10px;font-size:11px;font-weight:800}
.star{position:absolute;right:10px;top:8px;background:none;border:0;font-size:18px;color:var(--mut)}.star.on{color:var(--yel)}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.bar i{height:20px;border-radius:4px;background:var(--gf)}.bar i.k,.sw.k,.dot.k{background:var(--ok)}.bar i.o,.sw.o,.dot.o{background:var(--or)}.sw.m{background:var(--yel)}.sw.p{background:var(--ln);opacity:.6}.bar i.m{background:var(--yel)}.bar i.p{background:var(--ln);opacity:.6}.bar i.w{outline:2px solid var(--yel);outline-offset:1px}
.bar.lb span{font-size:10px;color:var(--mut);text-align:center}
.btn{background:var(--yel);color:var(--yt);border:0;border-radius:8px;padding:11px 16px;font-weight:800;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sc{background:var(--sf);color:var(--ink);border:1px solid var(--ln);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dtl img{width:100%;height:200px;object-fit:cover;border-radius:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.kv div{background:var(--bg);border-radius:8px;padding:8px;font-size:11px;color:var(--mut)}.kv b{display:block;color:var(--ink);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h2.t{font-size:20px;font-weight:800;margin-bottom:4px}.sub{color:var(--mut);margin-bottom:14px}
.fp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fp .rm{border:2px solid var(--ln);background:var(--fr);border-radius:10px;padding:10px;font-size:12px;color:var(--mut)}.fp .rm.f{border-color:var(--yel);background:var(--sf);color:var(--ink)}.fp b{font-size:14px;display:block;color:var(--ink)}
.lor{margin:10px 0;text-align:center;font-size:11px;color:var(--mut);background:repeating-linear-gradient(90deg,var(--fr) 0 14px,transparent 14px 20px);padding:4px}
.mx{display:grid;grid-template-columns:70px 1fr;gap:8px 10px;align-items:center;font-weight:600;font-size:12px}
.tb{width:100%;border-collapse:collapse}.tb td{padding:9px 0;border-bottom:1px solid var(--ln)}.tb td:last-child{text-align:right;font-weight:800}
.flow{display:grid;gap:10px;counter-reset:s}.flow div{counter-increment:s;display:flex;gap:12px;align-items:center;font-weight:800;font-size:16px}.flow div::before{content:counter(s);background:var(--bl);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px;border:1px dashed var(--ln);border-radius:12px}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login form{padding:8vw 6vw;display:flex;flex-direction:column;gap:12px;justify-content:center}.login .ph{background:var(--img) center/cover}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;max-width:90vw;z-index:40;border-bottom:3px solid var(--yel)}#toast.s{opacity:1}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.logo{padding:0 10px 0 0}.me{display:none}.two,.login{grid-template-columns:1fr}.login .ph{min-height:200px;order:-1}main{padding:16px}aside button.nv{white-space:nowrap;border-left:0}}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin:8px 0}.lg span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;background:var(--gf)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--gf)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}.cal .wd{font-size:11px;font-weight:800;color:var(--mut);text-align:center}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px;text-align:left;color:var(--ink);min-height:70px;display:flex;flex-direction:column;gap:2px;font-size:11px}.cd.on{border-color:var(--yel);outline:2px solid var(--yel)}.cd.wk{background:var(--fr)}.cd b{font-size:13px}.cd span{display:flex;align-items:center;gap:4px}
.gh{grid-column:1/-1;font-size:12px;color:var(--mut);margin-top:6px}.idl{font-size:10px;color:var(--mut)}
.wa{background:#d9fdd3;color:#111;border-radius:10px 10px 10px 2px;padding:10px 12px;max-width:440px;white-space:pre-line}
@media (max-width:820px){.cal{gap:3px}.cd{padding:4px;min-height:56px}}
</style></head><body>

function vDet(){const r=R.find(x=>x.c===D.c),d=D.day,ok=win(r.c,S.day,S.start,S.dur),alt=R.filter(x=>x.c!==r.c&&win(x.c,S.day,S.start,S.dur)).slice(0,2);
return `<button class="chip" onclick="go('find')">← Kembali</button><div class="two" style="margin-top:12px"><div class="dtl"><img src="${r.img}" alt="Ruang ${r.c}"><h2 class="t" style="margin-top:12px">${r.c} <span class="pill">${ok?"Kosong sampai "+T(endF(r.c,S.day,S.start)):"Tidak kosong di waktu pilihan"}</span></h2><div class="tg">${r.f.map(f=>`<i>${f}</i>`).join("")}</div><div class="kv"><div>Kapasitas<b>${r.cap} orang</b></div><div>Lokasi<b>${r.loc}</b></div><div>Jam kosong<b>${HS.filter(h=>st(r.c,d,h)==="f").length} dari ${HS.length}</b></div></div></div>
<div class="card"><h3>Jadwal ketersediaan</h3><label style="margin:8px 0">Tanggal<select onchange="D.day=+this.value;render()">${dOpt.map(x=>`<option value="${x[0]}"${x[0]===d?" selected":""}>${x[1]}</option>`).join("")}</select></label>${bar(r.c,d,d===S.day?S.start:-1,S.dur)}${LG()}<p class="sub" style="font-size:11px;margin:4px 0 12px">Bingkai kuning: waktu pilihanmu. ${idle(r.c,d)?"Ruang ini tidak dipakai seharian di tanggal ini.":""}</p><button class="btn" ${HS.some(h=>h<=15&&st(r.c,d,h)==="f")?"":"disabled"} onclick="BF={day:D.day};V='bk';render()">Booking ruang ini</button><div class="two" style="gap:8px;margin-top:8px"><button class="btn sc" onclick="fav('${r.c}')">${FV.has(r.c)?"Hapus dari favorit":"Simpan ke favorit"}</button><button class="btn sc" onclick="rep('${r.c}')">Lapor sedang terpakai</button></div></div></div>
<h3 style="margin:18px 0 8px">Alternatif kosong di jam yang sama</h3>${alt.length?`<div class="grid">${alt.map(card).join("")}</div>`:`<div class="empty">Belum ada ruang lain yang kosong di jam ini.</div>`}`}
function rep(c){if(nowH<7||nowH>16){toast("Laporan hanya untuk jam operasional 07.00–17.00");return}RP.add(c+0+nowH);toast("Terima kasih, "+c+" ditandai terpakai untuk jam ini");render()}
function setB(k,v){BF[k]=+v;if(k==="day"){delete BF.start;delete BF.dur}render()}
function vBook(){const r=R.find(x=>x.c===D.c),d=BF.day??S.day,fs=HS.filter(h=>h<=15&&st(r.c,d,h)==="f");
if(!fs.length)return `<button class="chip" onclick="V='det';render()">← Kembali</button><div class="empty" style="margin-top:14px">Tidak ada jam kosong di ruang ini pada hari yang dipilih. Pilih hari lain atau ruang lain.</div>`;
let s=BF.start??S.start;if(!fs.includes(s))s=fs[0];let mx=0;for(let h=s;h<=16&&mx<3&&st(r.c,d,h)==="f";h++)mx++;const n=Math.min(BF.dur??S.dur,mx);
return `<button class="chip" onclick="V='det';render()">← Kembali</button><div class="card" style="max-width:520px;margin:14px auto 0"><h2 class="t">Booking ruang ${r.c}</h2><p class="sub" style="font-size:12px">Kapasitas ${r.cap} orang, ${r.loc}. Disetujui otomatis bila ruang kosong dan sesuai aturan, lalu bukti dikirim lewat WhatsApp.</p><div class="fl">${sel("bd",dOpt,d,"Tanggal").replace("setS('bd'","setB('day'")}${sel("bs",fs.map(h=>[h,T(h)]),s,"Jam mulai").replace("setS('bs'","setB('start'")}${sel("bn",[1,2,3].filter(x=>x<=mx).map(x=>[x,x+" jam ("+T(s)+" - "+T(s+x)+")"]),n,"Durasi").replace("setS('bn'","setB('dur'")}</div>
<div class="fl"><label>Nama<input value="${U.name}" readonly></label><label>NIM<input inputmode="numeric" value="${BF.nim||""}" onchange="BF.nim=this.value"></label></div>
<div class="fl"><label>Keperluan<input value="${BF.purpose||""}" placeholder="Contoh: diskusi kelompok" onchange="BF.purpose=this.value"></label><label>Jumlah peserta<input type="number" min="1" max="${r.cap}" value="${BF.ppl||""}" onchange="BF.ppl=this.value"></label></div>
<div class="fl"><label>No. WhatsApp<input inputmode="tel" placeholder="081234567890" value="${BF.wa||""}" onchange="BF.wa=this.value"></label></div><p class="sub" style="font-size:11px">${RULES}</p><p id="be" role="alert" style="color:#d33;font-size:12px;min-height:18px"></p><button class="btn" onclick="doBook('${r.c}',${d},${s},${n})">Booking ruang</button></div>`}
function notif(j,t,wa,x){NT.push({j,t,wa,s:x,at:new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})});try{localStorage.setItem("sh-nt",JSON.stringify(NT.slice(-40)))}catch(e){}}
function doBook(c,d,s,n){const r=R.find(x=>x.c===c),e=m=>($("#be").textContent=m);
if(!/^\d{8,12}$/.test((BF.nim||"").trim()))return e("NIM harus berupa angka 8 sampai 12 digit.");
if(!(BF.purpose||"").trim())return e("Isi keperluan booking.");const p=+BF.ppl;if(!p||p<1||p>r.cap)return e("Jumlah peserta harus 1 sampai "+r.cap+" orang.");
const wa=(BF.wa||"").replace(/[\s-]/g,"");if(!/^(\+62|62|0)8\d{8,11}$/.test(wa))return e("Isi nomor WhatsApp aktif, misalnya 081234567890.");
if(d>MAXADV)return e("Booking hanya bisa sampai "+MAXADV+" hari ke depan.");
if(n>MAXDUR)return e("Maksimal "+MAXDUR+" jam per booking.");
if(BK.filter(b=>b.d>days[0].k||(b.d===days[0].k&&nowH<b.s+b.n)).length>=MAXACT)return e("Booking aktif sudah "+MAXACT+". Batalkan salah satu dulu.");
if(!win(c,d,s,n))return e("Jam ini baru saja terisi. Pilih jam lain.");
const id="SH-"+Math.random().toString(36).slice(2,7).toUpperCase();BK.push({id,c,d:days[d].k,s,n,nama:U.name,nim:BF.nim.trim(),tujuan:BF.purpose.trim(),ppl:p,wa});svb();
notif("Booking disetujui otomatis","Halo "+U.name+", booking ruang "+c+" disetujui.\n"+days[d].l+", "+T(s)+" - "+T(s+n)+"\nKode "+id+"\nBatalkan di SpaceHub sebelum jam mulai bila rencana berubah.",wa,"Terkirim");
notif("Pengingat 1 jam sebelum mulai","Pengingat: ruang "+c+" dipakai pukul "+T(s)+". Kode "+id+".",wa,"Terjadwal");
BF={};V="mine";render();toast("Booking disetujui. Notifikasi WhatsApp dikirim ke "+wa)}
function cancelB(id){const b=BK.find(x=>x.id===id);if(!b)return;if(b.d===days[0].k&&nowH>=b.s){toast("Booking yang sudah dimulai tidak bisa dibatalkan");return}
BK=BK.filter(x=>x.id!==id);NT=NT.filter(x=>!(x.s==="Terjadwal"&&x.t.includes(id)));svb();notif("Booking dibatalkan","Booking ruang "+b.c+" (kode "+id+") dibatalkan. Jamnya terbuka lagi untuk pengguna lain.",b.wa||"-","Terkirim");toast("Booking dibatalkan");render()}
function vMine(){const L=[...BK].sort((a,b)=>(a.d+pad(a.s)).localeCompare(b.d+pad(b.s)));return `<h2 class="t">Booking saya</h2><p class="sub">Semua booking ruang kamu. ${RULES}</p>${L.length?L.map(b=>{const dd=days.find(x=>x.k===b.d);return `<div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><div><h3>${b.c} <span class="pill">Disetujui otomatis</span></h3><p class="sub" style="margin:2px 0">${dd?dd.l:b.d}, ${T(b.s)} - ${T(b.s+b.n)} · ${b.ppl} orang</p><p style="font-size:12px;color:var(--mut)">${b.tujuan} · Kode ${b.id} · NIM ${b.nim} · WA ${b.wa||"-"}</p></div><button class="btn sc" style="width:auto" onclick="cancelB('${b.id}')">Batalkan booking</button></div>`}).join(""):`<div class="empty">Belum ada booking. Buka Cari ruang, pilih ruang yang kosong, lalu tekan Booking ruang.</div>`}`}
function vCal(){const o=info(CD),off=(days[0].w+6)%7,tg=(t,a,c)=>`<div class="card" style="margin-bottom:10px"><h3><i class="dot ${c}"></i> ${t} (${a.length})</h3>${a.length?`<div class="tg" style="margin-top:8px">${a.map(x=>`<i>${x}</i>`).join("")}</div>`:`<p class="sub" style="margin:6px 0 0">Tidak ada.</p>`}</div>`;
return `<h2 class="t">Kalender kelas</h2><p class="sub">${days[0].s} sampai ${days[30].s}. Tiap tanggal menunjukkan jumlah ruang yang ada kelas, dibooking, dan tidak dipakai seharian. Jadwal kuliah adalah data contoh.</p><div class="lg"><span><i class="dot k"></i>Ada kelas</span><span><i class="dot o"></i>Dibooking</span><span><i class="dot f"></i>Tidak dipakai seharian</span></div>
<div class="cal">${["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(x=>`<div class="wd">${x}</div>`).join("")}${Array(off).fill("<div></div>").join("")}${days.map((x,i)=>{const q=info(i);return `<button class="cd${i===CD?" on":""}${x.w%6===0?" wk":""}" onclick="CD=${i};render()" aria-label="${x.l}"><b>${x.n}</b><span><i class="dot k"></i>${q.k.length}</span><span><i class="dot o"></i>${q.b.length}</span><span><i class="dot f"></i>${q.u.length}</span></button>`}).join("")}</div>
<h3 style="margin:14px 0 8px">${days[CD].l}${days[CD].w===0?" (Minggu, tidak ada kuliah)":""}</h3>${tg("Ruang ada kelas",o.k,"k")}${tg("Ruang dibooking",o.b,"o")}${tg("Ruang tidak dipakai seharian",o.u,"f")}`}
function vWA(){return `<h2 class="t">Notifikasi WhatsApp</h2><p class="sub">Dikirim otomatis ke nomor yang diisi saat booking: konfirmasi, pengingat, dan pembatalan. Ini simulasi, tidak ada pesan WhatsApp yang benar-benar terkirim.</p>${NT.length?[...NT].reverse().map(n=>`<div style="margin-bottom:12px"><p style="font-size:11px;color:var(--mut)">Ke ${n.wa} · ${n.at} · ${n.s}</p><div class="wa"><b>${n.j}</b>\n${n.t}</div></div>`).join(""):`<div class="empty">Belum ada notifikasi. Notifikasi muncul setelah kamu booking ruang.</div>`}`}
function bar2(){return `<div class="fl" style="max-width:360px">${sel("day",dOpt,S.day,"Tanggal")}${sel("start",sOpt,S.start,"Mulai")}</div>`}
function vPlan(){const rs=R.filter(r=>r.fl===PL),h=Math.ceil(rs.length/2);const row=a=>`<div class="fp">${a.map(r=>{const f=win(r.c,S.day,S.start,1);return `<button class="rm${f?" f":""}" onclick="open_('${r.c}')"><b>${r.c}</b>${r.cap} orang<br>${f?`<span class="pill">Kosong sampai ${T(endF(r.c,S.day,S.start))}</span>`:"Terpakai"}</button>`}).join("")}</div>`;
return `<h2 class="t">Denah lantai</h2><p class="sub">Lihat ruang kosong per gedung (L2, L4, L5) dan lantai pada waktu yang dipilih.</p><div class="tabs">${Object.keys(FS).map(f=>`<button class="chip${f===PL?" on":""}" onclick="PL='${f}';render()">${FS[f]}</button>`).join("")}</div>${bar2()}<div class="card">${row(rs.slice(0,h))}<div class="lor">Lorong</div>${row(rs.slice(h))}</div><p class="sub" style="margin-top:8px;font-size:12px">Bingkai kuning: kosong. Abu-abu: terpakai.</p>`}
function vSched(){const d=S.day,u=R.filter(r=>idle(r.c,d)).length;return `<h2 class="t">Jadwal ruang</h2><p class="sub">Status tiap ruang per jam pada ${days[d].l}. ${u} dari ${R.length} ruang tidak dipakai seharian.</p><div class="fl" style="max-width:320px">${sel("day",dOpt,d,"Tanggal")}</div>${LG()}<div class="card"><div class="mx"><span></span><div class="bar lb">${HS.map(h=>`<span>${pad(h)}</span>`).join("")}</div>${Object.keys(FS).map(f=>`<h3 class="gh">${FS[f]}</h3>`+R.filter(r=>r.fl==f).map(r=>`<span>${r.c}</span><div>${bar(r.c,d).split('<div class="bar lb">')[0]}${idle(r.c,d)?'<span class="idl">Tidak dipakai seharian</span>':""}</div>`).join("")).join("")}</div></div>`}
function vFavs(){const L=R.filter(r=>FV.has(r.c));return `<h2 class="t">Ruang favorit</h2><p class="sub">Ruang yang kamu simpan, lengkap dengan status pada waktu yang dipilih.</p>${bar2()}${L.length?`<div class="grid">${L.map(card).join("")}</div>`:`<div class="empty">Belum ada favorit. Ketuk bintang pada ruang yang sering kamu pakai.</div>`}`}
function vFlow(){return `<h2 class="t">Alur sistem</h2><p class="sub">SpaceHub mencari dan memesan ruang kelas dalam satu sistem. Semua data di prototype ini adalah data contoh.</p><div class="card flow">${["Login email UNNES","Atur tanggal (sampai 30 hari ke depan) dan waktu","Lihat ruang kosong, jadwal, dan kalender kelas","Booking ruang, maksimal 3 jam","Disetujui otomatis bila ruang kosong dan sesuai aturan","Notifikasi WhatsApp terkirim otomatis","Kelola atau batalkan di Booking saya"].map(x=>`<div>${x}</div>`).join("")}</div>`}
function render(){
if(!U){$("#root").innerHTML=`<div class="login"><form onsubmit="login(event)"><h1 style="font-size:28px;font-weight:800;color:var(--bl)">SpaceHub</h1><h2>Selamat datang</h2><p class="sub">Masuk dengan email UNNES untuk melihat ruang kelas FEB UNNES yang sedang kosong.</p><label>Email UNNES<input id="em" value="mahasiswa@student.unnes.ac.id" autocomplete="username"></label><label>Password<input id="pw" type="password" value="contoh123" autocomplete="current-password"></label><p id="er" role="alert" style="color:#d33;font-size:12px"></p><button class="btn">Masuk</button><p class="sub" style="font-size:11px">Hanya untuk mahasiswa, dosen, dan tenaga kependidikan FEB UNNES. Ini prototype dengan data contoh.</p></form><div class="ph" style="--img:url(${IM.g})"></div></div>`;return}
const n=[["find","Cari ruang"],["plan","Denah lantai"],["sched","Jadwal ruang"],["cal","Kalender"],["favs","Favorit"],["mine","Booking saya"],["wa","Notifikasi WA"],["flow","Alur sistem"]],cur=["det","bk"].includes(V)?"find":V;
const body={find:vFind,det:vDet,bk:vBook,mine:vMine,plan:vPlan,sched:vSched,cal:vCal,wa:vWA,favs:vFavs,flow:vFlow}[V]();
$("#root").innerHTML=`<div class="app"><aside><div class="logo">Space<b>Hub</b></div>${n.map(x=>`<button class="nv${x[0]===cur?" on":""}" onclick="go('${x[0]}')">${x[1]}${cnt(x[0])?`<span class="bd">${cnt(x[0])}</span>`:""}</button>`).join("")}<div class="me"><b>Halo, ${U.name}</b><br>Mahasiswa FEB (data contoh)<br><button onclick="U=null;render()">Keluar</button></div></aside><main>${body}</main></div>`}
function login(e){e.preventDefault();const m=$("#em").value.trim().toLowerCase();if(!/^[^@\s]+@(student\.|mail\.)?unnes\.ac\.id$/.test(m)){$("#er").textContent="Gunakan email UNNES, misalnya nama@student.unnes.ac.id.";return}if(!$("#pw").value){$("#er").textContent="Isi password.";return}const n=m.split("@")[0].replace(/[^a-z]/g," ").trim().split(" ")[0]||"Pengguna";U={name:n[0].toUpperCase()+n.slice(1)};V="find";render()}
render();
</script></body></html>
